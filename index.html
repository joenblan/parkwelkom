<script>
/* ------------------------------------------------------------------ *
 * Tijd
 *
 * Niet de klok van het afspeelapparaat: die staat op een kiosk zonder
 * NTP zo een kwartier verkeerd, en dan hangt er een fout uurwerk in de
 * gang. We vragen de tijd aan de webserver via de Date-header van een
 * HEAD-verzoek naar deze pagina zelf, en onthouden het verschil met de
 * lokale klok. De tijdzone halen we uit Intl, dus een apparaat dat op
 * UTC staat toont evengoed Belgische tijd.
 * ------------------------------------------------------------------ */

let verschil = 0;            // servertijd minus apparaatklok, in ms
let gesynct = false;

async function synchroniseer() {
  try {
    const antwoord = await fetch(location.pathname + "?t=" + Date.now(),
                                 { method: "HEAD", cache: "no-store" });
    const kop = antwoord.headers.get("Date");
    if (kop) {
      const server = new Date(kop).getTime();
      if (!isNaN(server)) {
        verschil = server - Date.now();
        gesynct = true;
        toonBron();
        return;
      }
    }
  } catch (e) { /* netwerk weg: we blijven op het laatste verschil doorlopen */ }
  toonBron();
}

function nu() { return new Date(Date.now() + verschil); }

function toonBron() {
  const el = document.getElementById("tijdbron");
  el.textContent = gesynct ? "Lokale tijd" : "Tijd van dit toestel";
  el.classList.toggle("waarschuwing", !gesynct);
}

// Datumdelen in Europe/Brussels, ongeacht de instelling van het toestel.
const DEEL = new Intl.DateTimeFormat("en-GB", {
  timeZone: "Europe/Brussels", hourCycle: "h23",
  year: "numeric", month: "2-digit", day: "2-digit",
  hour: "2-digit", minute: "2-digit", second: "2-digit",
});
function delen(d) {
  const uit = {};
  for (const p of DEEL.formatToParts(d)) uit[p.type] = p.value;
  return uit;
}

const LANGE_DATUM = new Intl.DateTimeFormat("nl-BE", {
  timeZone: "Europe/Brussels", weekday: "long", day: "numeric", month: "long",
});
const KORTE_DAG = new Intl.DateTimeFormat("nl-BE", {
  timeZone: "Europe/Brussels", weekday: "long",
});

/* ------------------------------------------------------------------ *
 * Analoge klok
 * Met alle twaalf cijfers: op een lagere school leren kinderen hier de
 * klok op lezen, en dan is een wijzerplaat met enkel streepjes zonde.
 * ------------------------------------------------------------------ */

function bouwWijzerplaat() {
  const svg = document.getElementById("klok");
  let d = '<circle cx="100" cy="100" r="95" class="rand"/>';

  for (let i = 0; i < 60; i++) {
    const hoek = i * 6 * Math.PI / 180;
    const uur = i % 5 === 0;
    const r1 = uur ? 78 : 83;
    const r2 = 88;
    d += '<line x1="' + (100 + r1 * Math.sin(hoek)) +
         '" y1="' + (100 - r1 * Math.cos(hoek)) +
         '" x2="' + (100 + r2 * Math.sin(hoek)) +
         '" y2="' + (100 - r2 * Math.cos(hoek)) +
         '" class="' + (uur ? "uurstreep" : "minuutstreep") + '"/>';
  }

  for (let u = 1; u <= 12; u++) {
    const hoek = u * 30 * Math.PI / 180;
    d += '<text x="' + (100 + 64 * Math.sin(hoek)) +
         '" y="' + (100 - 64 * Math.cos(hoek)) +
         '" class="cijfer">' + u + '</text>';
  }

  d += '<line id="uurwijzer" x1="100" y1="112" x2="100" y2="45" class="uur"/>' +
       '<line id="minuutwijzer" x1="100" y1="116" x2="100" y2="28" class="minuut"/>' +
       '<line id="secondewijzer" x1="100" y1="120" x2="100" y2="24" class="seconde"/>' +
       '<circle cx="100" cy="100" r="5" class="spil"/>';

  svg.innerHTML = d;
}

function tikTak() {
  const d = nu();
  const p = delen(d);
  const u = Number(p.hour) % 12;
  const m = Number(p.minute);
  const s = Number(p.second);

  const zet = (id, graden) =>
    document.getElementById(id)
      .setAttribute("transform", "rotate(" + graden + " 100 100)");

  zet("uurwijzer", (u + m / 60) * 30);
  zet("minuutwijzer", (m + s / 60) * 6);
  zet("secondewijzer", s * 6);

  document.getElementById("digitaal").textContent = p.hour + ":" + p.minute;
  document.getElementById("kopdatum").textContent = LANGE_DATUM.format(d);
}

/* ------------------------------------------------------------------ *
 * Weer — Open-Meteo, geen sleutel nodig
 * ------------------------------------------------------------------ */

const BREEDTE = 50.995, LENGTE = 3.805;          // Melle
const WEER_URL = "https://api.open-meteo.com/v1/forecast" +
  "?latitude=" + BREEDTE + "&longitude=" + LENGTE +
  "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m" +
  "&daily=weather_code,temperature_2m_max,temperature_2m_min," +
  "precipitation_probability_max,sunrise,sunset" +
  "&hourly=weather_code" +
  "&timezone=Europe%2FBrussels&forecast_days=6";

// WMO-codes naar Nederlandse omschrijving en pictogram.
const WEERCODES = {
  0:  ["Onbewolkt", "zon"],
  1:  ["Overwegend zonnig", "zonwolk"],
  2:  ["Half bewolkt", "zonwolk"],
  3:  ["Bewolkt", "wolk"],
  45: ["Mistig", "mist"],
  48: ["Aanvriezende mist", "mist"],
  51: ["Lichte motregen", "motregen"],
  53: ["Motregen", "motregen"],
  55: ["Dichte motregen", "motregen"],
  56: ["IJzelige motregen", "ijzel"],
  57: ["IJzelige motregen", "ijzel"],
  61: ["Lichte regen", "regen"],
  63: ["Regen", "regen"],
  65: ["Zware regen", "regen"],
  66: ["IJzel", "ijzel"],
  67: ["Zware ijzel", "ijzel"],
  71: ["Lichte sneeuw", "sneeuw"],
  73: ["Sneeuw", "sneeuw"],
  75: ["Zware sneeuw", "sneeuw"],
  77: ["Sneeuwkorrels", "sneeuw"],
  80: ["Enkele buien", "buien"],
  81: ["Buien", "buien"],
  82: ["Zware buien", "buien"],
  85: ["Sneeuwbuien", "sneeuw"],
  86: ["Zware sneeuwbuien", "sneeuw"],
  95: ["Onweer", "onweer"],
  96: ["Onweer met hagel", "onweer"],
  99: ["Zwaar onweer met hagel", "onweer"],
};

function omschrijving(code) {
  return (WEERCODES[code] || ["Wisselvallig", "wolk"])[0];
}
function pictogramNaam(code) {
  return (WEERCODES[code] || ["Wisselvallig", "wolk"])[1];
}

const ZON = '<circle cx="32" cy="32" r="13" class="i-zon"/>' +
  [0, 45, 90, 135, 180, 225, 270, 315].map(g => {
    const r = g * Math.PI / 180;
    return '<line x1="' + (32 + 19 * Math.cos(r)) + '" y1="' + (32 + 19 * Math.sin(r)) +
           '" x2="' + (32 + 26 * Math.cos(r)) + '" y2="' + (32 + 26 * Math.sin(r)) +
           '" class="i-straal"/>';
  }).join("");
const WOLK = '<path d="M18 44h26a10 10 0 0 0 0-20 14 14 0 0 0-26-4 9 9 0 0 0 0 24z" class="i-wolk"/>';

function pictogram(code, klasse) {
  const soort = pictogramNaam(code);
  let binnen = "";
  if (soort === "zon") binnen = ZON;
  else if (soort === "zonwolk")
    binnen = '<g transform="translate(6,-6) scale(0.72)">' + ZON + "</g>" +
             '<g transform="translate(0,6)">' + WOLK + "</g>";
  else if (soort === "mist")
    binnen = WOLK + '<line x1="14" y1="52" x2="50" y2="52" class="i-lijn"/>' +
             '<line x1="18" y1="58" x2="46" y2="58" class="i-lijn"/>';
  else if (soort === "motregen" || soort === "regen" || soort === "buien") {
    binnen = WOLK;
    const n = soort === "motregen" ? 2 : 3;
    for (let i = 0; i < n; i++)
      binnen += '<line x1="' + (22 + i * 10) + '" y1="50" x2="' +
                (18 + i * 10) + '" y2="60" class="i-druppel"/>';
  } else if (soort === "sneeuw") {
    binnen = WOLK;
    for (let i = 0; i < 3; i++)
      binnen += '<circle cx="' + (22 + i * 10) + '" cy="55" r="2.6" class="i-vlok"/>';
  } else if (soort === "ijzel") {
    binnen = WOLK + '<line x1="24" y1="50" x2="20" y2="60" class="i-druppel"/>' +
             '<circle cx="38" cy="55" r="2.6" class="i-vlok"/>';
  } else if (soort === "onweer") {
    binnen = WOLK + '<path d="M32 48l-8 12h7l-3 10 12-14h-7l4-8z" class="i-bliksem"/>';
  } else binnen = WOLK;
  return '<svg class="pictogram ' + klasse + '" viewBox="0 0 64 68">' + binnen + "</svg>";
}

/* Het daggetal weather_code van Open-Meteo is "de zwaarste toestand van de
 * dag": één bui om 3 uur 's nachts of één onweersuur maakt van een zonnige
 * dag een buien- of onweersdag. Daarom kiezen we zelf een pictogram uit de
 * uurwaarden tijdens de schooldag (8 tot 17 uur): de soort weer die de
 * meeste uren voorkomt. Neerslag wint van droog weer zodra het minstens
 * DREMPEL uren valt, zodat een natte middag niet wegvalt tegen een droge
 * ochtend. Binnen de gekozen soort tonen we de zwaarste code. */
const VAN_UUR = 8, TOT_UUR = 17, DREMPEL = 3;
const DROOG = new Set(["zon", "zonwolk", "wolk", "mist"]);

function dagCode(w, dag) {
  const uren = w.hourly;
  if (!uren || !uren.time) return w.daily.weather_code[dag];
  const tel = {}, zwaarste = {};
  for (let i = 0; i < uren.time.length; i++) {
    const t = uren.time[i];
    if (t.slice(0, 10) !== w.daily.time[dag]) continue;
    const uur = Number(t.slice(11, 13));
    if (uur < VAN_UUR || uur >= TOT_UUR) continue;
    const code = uren.weather_code[i];
    if (code == null) continue;
    const soort = pictogramNaam(code);
    tel[soort] = (tel[soort] || 0) + 1;
    zwaarste[soort] = Math.max(zwaarste[soort] ?? -1, code);
  }
  const soorten = Object.keys(tel);
  if (!soorten.length) return w.daily.weather_code[dag];
  const nat = soorten.filter(s => !DROOG.has(s) && tel[s] >= DREMPEL);
  const kandidaten = nat.length ? nat : soorten;
  kandidaten.sort((a, b) => tel[b] - tel[a] || zwaarste[b] - zwaarste[a]);
  return zwaarste[kandidaten[0]];
}

function graden(t) { return Math.round(t) + "\u00b0"; }
function uurtje(iso) { return iso.slice(11, 16); }

let laatsteWeer = null;

async function haalWeer() {
  try {
    const r = await fetch(WEER_URL, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    laatsteWeer = await r.json();
    tekenWeer(true);
  } catch (e) {
    if (laatsteWeer) tekenWeer(false);
    else document.getElementById("nu").textContent =
      "Weerbericht niet beschikbaar.";
  }
}

function tekenWeer(vers) {
  const w = laatsteWeer;
  if (!w) return;

  const h = w.current, d = w.daily;
  const nuEl = document.getElementById("nu");
  nuEl.classList.remove("nu-laden");
  nuEl.innerHTML =
    pictogram(h.weather_code, "groot") +
    '<div class="nugetal">' +
      '<p class="temp">' + graden(h.temperature_2m) + '</p>' +
      '<p class="omschrijving">' + omschrijving(h.weather_code) + '</p>' +
      '<p class="bijzaken">Voelt als ' + graden(h.apparent_temperature) +
        ' \u00b7 wind ' + Math.round(h.wind_speed_10m) + ' km/u' +
        ' \u00b7 ' + (d.precipitation_probability_max[0] ?? 0) + '% kans op regen</p>' +
      '<p class="bijzaken">Zon op ' + uurtje(d.sunrise[0]) +
        ' \u00b7 onder ' + uurtje(d.sunset[0]) + '</p>' +
    '</div>';

  let rij = "";
  for (let i = 1; i < d.time.length; i++) {
    const dag = new Date(d.time[i] + "T12:00:00");
    const naam = i === 1 ? "morgen" : KORTE_DAG.format(dag);
    rij += '<article>' +
      '<p class="dagnaam">' + naam + '</p>' +
      '<div class="dagicoon">' + pictogram(dagCode(w, i), "klein") + '</div>' +
      '<p class="dagtemp"><span class="max">' + graden(d.temperature_2m_max[i]) +
        '</span><span class="min">' + graden(d.temperature_2m_min[i]) + '</span></p>' +
      '<p class="regen">' + (d.precipitation_probability_max[i] ?? 0) + '%</p>' +
      '</article>';
  }
  document.getElementById("dagen").innerHTML = rij;

  document.getElementById("weerbron").textContent = vers
    ? "Weergegevens: Open-Meteo"
    : "Weergegevens: Open-Meteo (verbinding weg, laatste bericht)";
}

/* ------------------------------------------------------------------ *
 * Opstarten
 * ------------------------------------------------------------------ */

// Een scherm dat maandenlang hetzelfde toont brandt in. Elke vijf minuten
// een paar pixels opschuiven is genoeg om dat te voorkomen.
const SCHUIF = [[0,0],[2,1],[3,0],[2,-1],[0,-2],[-2,-1],[-3,0],[-2,1]];
let schuifIndex = 0;
function pixelShift() {
  const [x, y] = SCHUIF[schuifIndex % SCHUIF.length];
  document.getElementById("scherm").style.transform =
    "translate(" + x + "px," + y + "px)";
  schuifIndex++;
}

bouwWijzerplaat();
tikTak();
pixelShift();
synchroniseer().then(tikTak);
haalWeer();

setInterval(tikTak, 1000);
setInterval(synchroniseer, 10 * 60 * 1000);   // klok bijregelen
setInterval(haalWeer, 15 * 60 * 1000);        // nieuw weerbericht
setInterval(pixelShift, 5 * 60 * 1000);
setTimeout(() => location.reload(), 3 * 60 * 60 * 1000);
</script>
